name: Count and Sum
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    name: count-and-sum
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run analysis script and capture output
      id: run_script
      run: |
          OUTPUT=$(
            find . -type f -name 'tt*' -print0 | \
            while IFS= read -r -d $'\0' file; do
                awk -F ',' '{ sum += $4 } END { print sum }' "$file" 2>/dev/null 
            done | awk '
                { 
                    total += $1;
                    file_count++;
                } 
                END { 
                    print "TOTAL_COUNT:", file_count;
                    print "GRAND_SUM:", total;
                }
            '
          )
          COUNT=$(echo "$OUTPUT" | grep 'TOTAL_COUNT:' | awk '{print $2}')
          SUM=$(echo "$OUTPUT" | grep 'GRAND_SUM:' | awk '{print $2}')
          echo "Analysis Complete. Count: $COUNT, Sum: $SUM"
          echo "file_count=$COUNT" >> $GITHUB_OUTPUT
          echo "grand_sum=$SUM" >> $GITHUB_OUTPUT

    - name: Format Byte Size (Bytes to MB/GB/TB)
      id: format_size
      run: |
        # Shell function to convert raw bytes to human-readable format (MB, GB, TB)
        format_bytes() {
            local bytes=$1
            local units=('Bytes' 'KB' 'MB' 'GB' 'TB')
            local i=0

            # Ensure bc is installed for floating point arithmetic
            if ! command -v bc &> /dev/null; then
                printf "%d %s" "$bytes" "${units[0]}"
                return
            fi

            # Loop until bytes is less than 1024 or we reach TB
            while (( $(echo "$bytes >= 1024" | bc -l) )) && (( i < 4 )); do
                # Perform division using bc for precise floating point (to the nearest MB, GB, or TB)
                bytes=$(echo "scale=2; $bytes / 1024" | bc -l)
                i=$((i + 1))
            done

            # Output the formatted size (e.g., 1.50 GB)
            printf "%.2f %s" "$bytes" "${units[$i]}"
        }
        
        # Run the function on the raw sum and set the output variable
        RAW_BYTES="${{ steps.run_script.outputs.raw_grand_sum }}"
        FORMATTED_SUM=$(format_bytes "$RAW_BYTES")
        
        echo "Formatted Sum: $FORMATTED_SUM"
        echo "formatted_sum=$FORMATTED_SUM" >> $GITHUB_OUTPUT

    - name: Generate new README content
      id: generate_content
      run: |
        # Use the formatted sum from the previous step
        FILE_COUNT="${{ steps.run_script.outputs.file_count }}"
        FORMATTED_SUM="${{ steps.format_size.outputs.formatted_sum }}"
        
        # Generate a more visually appealing/modern Markdown block
        NEW_CONTENT=$(cat << EOF
        <div align="center">
        
        | Metric | Value |
        | :--- | :---: |
        | **Last Processed** | $(date -u +"%Y-%m-%d %H:%M UTC") |
        | **Files Analysed** | $FILE_COUNT |
        | **Total Size** | $FORMATTED_SUM |
        
        </div>
        EOF
        )
        
        # Output the generated content, escaped for use in the next step
        echo "new_content<<EOF_CONTENT" >> $GITHUB_OUTPUT
        echo "$NEW_CONTENT" >> $GITHUB_OUTPUT
        echo "EOF_CONTENT" >> $GITHUB_OUTPUT

    - name: Update README.md with AWK replacement
      # We use awk to precisely replace content between markers
      run: |
        START_MARKER="<!-- START_DATA_SUMMARY -->"
        END_MARKER="<!-- END_DATA_SUMMARY -->"
        
        # Retrieve the generated content from the previous step's output
        NEW_CONTENT="${{ steps.generate_content.outputs.new_content }}"
        
        # AWK script to find markers and replace content in-place
        awk -v start="$START_MARKER" -v end="$END_MARKER" -v content="$NEW_CONTENT" '
        $0 ~ start { 
            p=1; 
            print $0; 
            print content; 
            next 
        }
        $0 ~ end { 
            p=0; 
            print $0; 
            next 
        }
        !p { print $0 }
        ' README.md > README.md.tmp
        
        # Replace original file with the modified content
        mv README.md.tmp README.md

    - name: Commit and Push changes
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: 'ci(data): Automated data summary update [skip ci]'
        branch: ${{ github.ref_name }} # Ensures it commits to the branch it was run on
        commit_user_name: 'github-actions[bot]'
        commit_user_email: 'github-actions[bot]@users.noreply.github.com'
